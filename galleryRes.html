<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="Index.css">
    <title>Document</title>
</head>
<body>
    <!-- ==================== قسم معرض الصور (Gallery Section) ==================== -->
    <section id="gallery">
        
        <!-- 1. عنوان القسم (Section title) -->
        <div class="gallery-header">
            <span class="sub-title">جولة بصرية</span>
            <h2>معرض أطباقنا وأجوائنا البحرية</h2>
        </div>

        <!-- 2. الصور (Images) -->
        <div class="gallery-grid">
            
            <!-- الصورة 1: جمبري مشوي فاخر -->
            <div class="gallery-item">
                <img src="https://unsplash.com" alt="طبق جمبري مشوي بالليمون والأعشاب">
            </div>

            <!-- الصورة 2: أسماك طازجة في الميناء -->
            <div class="gallery-item">
                <img src="https://unsplash.com" alt="أسماك طازجة معروضة على الثلج صيد اليوم">
            </div>

            <!-- الصورة 3: طبق سمك السلمون المشوي -->
            <div class="gallery-item">
                <img src="https://unsplash.com" alt="فيليه سمك السلمون المشوي مع الخضار">
            </div>

            <!-- الصورة 4: أجواء المطبخ وتحضير الطعام -->
            <div class="gallery-item">
                <img src="https://unsplash.com" alt="طاهي يحضر وجبة مأكولات بحرية على الفحم">
            </div>

            <!-- الصورة 5: طبق فواكه البحر المشكلة -->
            <div class="gallery-item">
                <img src="https://unsplash.com" alt="طبق مشكل من ثمار البحر والكالاماري والبلح">
            </div>

            <!-- الصورة 6: طاولة عشاء في المطعم -->
            <div class="gallery-item">
                <img src="https://unsplash.com" alt="طاولة عشاء منظمة داخل المطعم بأجواء دافئة">
            </div>

        </div>
    </section>
     <script src="Index.js"></script>
    <!-- زر العودة للأعلى السحري -->
<button id="back-to-top" class="back-to-top-btn">⬆️</button>
</body>
</html>
