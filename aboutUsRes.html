<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="Index.css">
    <title>Document</title>
</head>
<body>
<!-- ==================== قسم من نحن (About Us Section) ==================== -->
    <section id="about-us">
        <div class="about-container">
            
            <!-- 1. صورة للمطعم / الأكل -->
            <div class="about-image">
                <!-- تقدري تبدلي placeholder.jpg برابط الصورة الحقيقية كي توجد -->
                <img src="placeholder.jpg" alt="طباخ يحضر طبق مأكولات بحرية طازجة في مطعمنا">
            </div>

            <!-- 2. المحتوى (Content) -->
            <div class="about-content">
                
                <!-- عنوان صغير: About Us -->
                <span class="sub-title">About Us</span>
                
                <!-- عنوان رئيسي -->
                <h2>حكايتنا بدأت من شغفنا بخيرات البحر</h2>
                
                <!-- فقرة قصيرة -->
                <p>في مطعمنا، نؤمن أن المأكولات البحرية ليست مجرد وجبة، بل هي تجربة فريدة تجمع بين الطعم الطازج والأصالة. منذ اليوم الأول، التزمنا بجلب صيد اليوم مباشرة من الميناء إلى طبقك، لنوفر لك نكهة حقيقية لا تُنسى وسط أجواء عائلية دافئة.</p>
                
                <!-- زر: Learn More -->
                <a href="#story" class="btn-learn-more">اكتشف قصتنا الكاملة 🌊</a>
                
            </div>

        </div>
    </section>
  <script src="Index.js"></script>
    <!-- زر العودة للأعلى السحري -->
<button id="back-to-top" class="back-to-top-btn">⬆️</button>
